name: reviewdog
on: [pull_request]
jobs:
  actionlint:
    name: runner / actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: actionlint
        uses: reviewdog/action-actionlint@64ee8e65a9d3b95638a186121c7d0754d62018d8 # v1.2.0
        with:
          fail_on_error: true
          reporter: github-pr-review
